[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debunk"
dynamic = ["version"]
description = "Re-test AI pentest agent findings before you trust them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "iamwizzyg" }]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema", "pytest", "ruff"]

[project.scripts]
debunk = "debunk.cli:main"

[project.urls]
Homepage = "https://github.com/iamwizzyg/debunk"
Issues = "https://github.com/iamwizzyg/debunk/issues"

[tool.setuptools.dynamic]
version = { attr = "debunk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["debunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
